<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ka-Barangay Connect — Dashboard</title>
    <link rel="icon" href="assets/img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
     <link rel="icon" href="assets/img/logo.png" type="image/x-icon">
</head>
<body class="page-official">

    <div class="container-fluid p-3 p-md-4">
        <div class="row g-3">

            <!-- SIDEBAR -->
            <div class="col-12 col-lg-3">
                <div class="sidebar">
                    <div class="sidebar-top">
                        <div class="sidebar-logo-wrap">
                            <img src="assets/img/logo.png" alt="Logo" onerror="this.style.display='none';this.parentElement.textContent='SB'">
                        </div>
                        <div>
                            <div class="sidebar-admin">Admin Panel</div>
                            <div class="sidebar-name">San Bartolome</div>
                        </div>
                    </div>

                    <div class="sidebar-nav">
                        <a href="official.html" class="sidebar-nav-item active">
                            <i class="fa fa-tachometer"></i> Dashboard
                        </a>
                        <a href="#" class="sidebar-nav-item">
                            <i class="fa fa-flag"></i> Report
                        </a>
                        <a href="#" class="sidebar-nav-item">
                            <i class="fa fa-comments"></i> Community Issue
                        </a>
                        <a href="#" class="sidebar-nav-item">
                            <i class="fa fa-briefcase"></i> Projects
                        </a>
                    </div>

                    <div class="sidebar-footer">
                        <a href="#" class="sidebar-btn profile">
                            <i class="fa fa-user"></i> Profile
                        </a>
                        <a href="#" class="sidebar-btn logout">
                            <i class="fa fa-sign-out"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="col-12 col-lg-9">
                <div class="main-card">

                    <!-- Top Nav -->
                    <div class="top-nav">
                        <div class="top-nav-left">
                            <a href="index.html" class="back-btn light">&#8592; Back</a>
                            <span class="top-nav-title">Dashboard Overview</span>
                        </div>
                        <div class="top-nav-pills">
                            <a href="#" class="nav-pill">Report</a>
                            <a href="#" class="nav-pill">Community Issue</a>
                            <a href="#" class="nav-pill">Projects</a>
                            <a href="official.html" class="nav-pill active">Dashboard</a>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="stats-row">
                        <div class="stat-box">
                            <div class="stat-label">Pending</div>
                            <div class="stat-num">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">In Progress</div>
                            <div class="stat-num">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Resolved</div>
                            <div class="stat-num">0</div>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="content-area">
                        <div class="content-header">
                            <span class="content-eyebrow">Overview</span>
                            <div class="content-line"></div>
                        </div>
                        <div class="content-empty">
                            <div class="content-empty-icon">
                                <i class="fa fa-bar-chart"></i>
                            </div>
                            <p>Welcome to the Ka-Barangay Connect Admin Dashboard.</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
