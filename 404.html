<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found — Ka-Barangay Connect</title>
  <link href="assets/img/logo.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #04005a;
      background-image: url('assets/img/barangay_header.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      color: white;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(4, 0, 90, 0.82);
      z-index: 0;
      pointer-events: none;
    }

    nav, main {
      position: relative;
      z-index: 1;
    }

   
    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      text-align: center;
    }

    .error-wrap {
      max-width: 480px;
      width: 100%;
    }

    .error-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #f5cc00;
      margin-bottom: 1rem;
    }

    .error-code {
      font-family: 'Sora', sans-serif;
      font-size: clamp(80px, 18vw, 120px);
      font-weight: 800;
      color: #f5cc00;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 0.5rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #f5cc00;
      border-radius: 99px;
      margin: 0 auto 1.5rem;
    }

    .error-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    .error-sub {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.8;
      margin-bottom: 2.5rem;
      letter-spacing: 0.02em;
    }

    /* ── BUTTONS ── */
    .btn-group-404 {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary-404 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f5cc00;
      color: #04005a;
      font-family: 'Sora', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 4px;
      text-decoration: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .btn-primary-404:hover {
      opacity: 0.88;
      transform: translateY(-2px);
      color: #04005a;
    }

    .btn-secondary-404 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Sora', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-decoration: none;
      transition: border-color 0.3s, color 0.3s;
    }

    .btn-secondary-404:hover {
      border-color: rgba(255, 255, 255, 0.55);
      color: #fff;
    }

    @media (max-width: 480px) {
      .navbar-brand-text .sub { display: none; }
    }
  </style>
</head>
<body>


  <!-- MAIN -->
  <main>
    <div class="error-wrap">
      <p class="error-eyebrow">Ka-Barangay Connect</p>
      <div class="error-code">404</div>
      <div class="divider"></div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-sub">
        Sorry, the page you're looking for doesn't exist<br>
        or may have been moved. Check the URL or<br>
        return to the homepage.
      </p>
      <div class="btn-group-404">
        <a href="index.html" class="btn-primary-404">← Back to Home</a>
      </div>
    </div>
  </main>

</body>
</html>
